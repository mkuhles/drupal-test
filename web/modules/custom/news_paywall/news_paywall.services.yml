services:
  logger.channel.news_paywall:
    parent: logger.channel_base
    arguments: ['news_paywall']
    
  news_paywall.entitlement_checker:
    class: Drupal\news_paywall\Service\EntitlementChecker
    arguments: ['@entity_type.manager', '@current_user']

  news_paywall.field_access:
    class: Drupal\news_paywall\Access\PaywallFieldAccessChecker
    arguments: ['@news_paywall.entitlement_checker']

  news_paywall.cta_builder:
    class: Drupal\news_paywall\Render\PaywallCtaBuilder
    arguments: ['@news_paywall.entitlement_checker', '@request_stack']

  news_paywall.order_placed_subscriber:
    class: Drupal\news_paywall\EventSubscriber\OrderPlacedSubscriber
    arguments: ['@entity_type.manager', '@config.factory', '@logger.channel.news_paywall']
    tags:
      - { name: event_subscriber }

  news_paywall.order_paid_subscriber:
    class: Drupal\news_paywall\EventSubscriber\OrderPaidSubscriber
    arguments: ['@config.factory', '@logger.channel.news_paywall']
    tags:
      - { name: event_subscriber }
